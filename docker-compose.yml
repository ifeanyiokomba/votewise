# VoteWise — Production Docker Compose
# Full production stack: App + Results Service + PostgreSQL + Redis

version: '3.8'

services:
  # ---- Main Application (Next.js) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://votewise:${DB_PASSWORD}@db:5432/votewise
      - REDIS_URL=redis://redis:6379
      - VOTE_ENC_KEY=${VOTE_ENC_KEY}
      - VOTER_HASH_PEPPER=${VOTER_HASH_PEPPER}
      - HMAC_SECRET=${HMAC_SECRET}
      - SVE_BALLOT_PEPPER=${SVE_BALLOT_PEPPER}
      - SVE_VOTER_PEPPER=${SVE_VOTER_PEPPER}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - TERMII_API_KEY=${TERMII_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '1'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - votewise-net

  # ---- Results Service (WebSocket) ----
  results-service:
    build:
      context: ./mini-services/results-service
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - DATABASE_URL=postgresql://votewise:${DB_PASSWORD}@db:5432/votewise
      - VOTE_ENC_KEY=${VOTE_ENC_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '1'
    networks:
      - votewise-net

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=votewise
      - POSTGRES_USER=votewise
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votewise -d votewise"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - votewise-net

  # ---- Redis Cache ----
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - votewise-net

  # ---- Caddy Reverse Proxy / Load Balancer ----
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - results-service
    restart: always
    networks:
      - votewise-net

  # ---- Background Worker (for jobs, notifications, imports) ----
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "-e", "require('./src/lib/jobs').startWorker()"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://votewise:${DB_PASSWORD}@db:5432/votewise
      - REDIS_URL=redis://redis:6379
      - VOTE_ENC_KEY=${VOTE_ENC_KEY}
      - VOTER_HASH_PEPPER=${VOTER_HASH_PEPPER}
      - HMAC_SECRET=${HMAC_SECRET}
      - SVE_BALLOT_PEPPER=${SVE_BALLOT_PEPPER}
      - SVE_VOTER_PEPPER=${SVE_VOTER_PEPPER}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    networks:
      - votewise-net

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  votewise-net:
    driver: bridge
