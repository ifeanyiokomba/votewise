# VoteWise — Main Application Deployment (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: votewise-app
  namespace: votewise
  labels:
    app: votewise-app
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime: never drop below desired count
  selector:
    matchLabels:
      app: votewise-app
  template:
    metadata:
      labels:
        app: votewise-app
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: votewise-app
                topologyKey: topology.kubernetes.io/zone   # spread across AZs
      containers:
        - name: app
          image: ghcr.io/ifeanyiokomba/votewise:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: votewise-config
            - secretRef:
                name: votewise-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/pihed/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/pihed/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let the load balancer deregister before the pod exits so
                # active vote sessions complete (zero-downtime requirement).
                command: ["sleep", "15"]
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: votewise-app
  namespace: votewise
spec:
  type: ClusterIP
  selector:
    app: votewise-app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
