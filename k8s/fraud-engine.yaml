# VoteWise — Fraud Engine (EIFDIRS detectors, risk scorer, incident manager)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: votewise-fraud-engine
  namespace: votewise
  labels:
    app: votewise-fraud-engine
    tier: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: votewise-fraud-engine
  template:
    metadata:
      labels:
        app: votewise-fraud-engine
        tier: security
    spec:
      containers:
        - name: fraud-engine
          image: ghcr.io/ifeanyiokomba/votewise-fraud-engine:latest
          command: ["node", "fraud-engine.js"]
          envFrom:
            - configMapRef:
                name: votewise-config
            - secretRef:
                name: votewise-secrets
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
