# VoteWise — Horizontal Pod Autoscalers
# Auto-scales based on CPU + memory (spec: "CPU usage, memory usage, queue size, request rate").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: votewise-app-hpa
  namespace: votewise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: votewise-app
  minReplicas: 3
  maxReplicas: 20              # scales to handle election-day peaks
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      policies:
        - type: Percent
          value: 100            # double capacity quickly on peak
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # don't flap during brief dips
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: votewise-worker-hpa
  namespace: votewise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: votewise-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: votewise-notification-hpa
  namespace: votewise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: votewise-notification
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
