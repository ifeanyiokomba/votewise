# VoteWise — Ingress (multi-tenant routing + custom domains + TLS termination)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: votewise-ingress
  namespace: votewise
  annotations:
    # NGINX Ingress Controller (swap for ALB ingress on EKS, GCE on GKE)
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Rate limiting at the edge (spec: "Rate limiting" under Security Hardening)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    # HSTS + security headers (spec: "HSTS" under SSL & Encryption)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
spec:
  tls:
    - hosts:
        - votewise.com.ng
        - "*.votewise.com.ng"          # multi-tenant: org subdomains
        - "*.verifyvotes.com"          # multi-tenant: shared verify domain
      secretName: votewise-tls
  rules:
    # Apex domain
    - host: votewise.com.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votewise-app
                port: { number: 80 }
    # Org subdomain wildcard (mouau.verifyvotes.com, unilag.verifyvotes.com, ...)
    - host: "*.verifyvotes.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votewise-app
                port: { number: 80 }
    # Org subdomain on main domain (org.votewise.com.ng)
    - host: "*.votewise.com.ng"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votewise-app
                port: { number: 80 }
    # WebSocket upgrade path → results service
    # (handled by the app via ?XTransformPort=3030; the ingress just forwards)
---
# Custom domain ingress (per-org apex/sub domains like vote.university.edu.ng)
# cert-manager issues a certificate per custom domain automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: votewise-custom-domains
  namespace: votewise
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    # Custom domains are added dynamically by the platform's domain manager.
    # In practice, each custom domain gets its own Ingress + Certificate CRD.
    - hosts:
        - vote.university.edu.ng
      secretName: custom-domain-university-edu-ng
  rules:
    - host: vote.university.edu.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: votewise-app
                port: { number: 80 }
