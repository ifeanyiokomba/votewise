apiVersion: v1
kind: Secret
metadata:
  name: votewise-secrets
  namespace: votewise
type: Opaque
stringData:
  # In production, populate from AWS Secrets Manager / Vault via:
  #   kubectl create secret generic votewise-secrets --from-literal=...
  # or via ExternalSecrets operator. NEVER commit real values.
  VOTE_ENC_KEY: "REPLACE_ME"
  VOTER_HASH_PEPPER: "REPLACE_ME"
  HMAC_SECRET: "REPLACE_ME"
  SVE_BALLOT_PEPPER: "REPLACE_ME"
  SVE_VOTER_PEPPER: "REPLACE_ME"
  VOTE_KEY_ID: "v1"
  DB_PASSWORD: "REPLACE_ME"
  PAYSTACK_SECRET_KEY: ""
  FLUTTERWAVE_SECRET_KEY: ""
  RESEND_API_KEY: ""
  TERMII_API_KEY: ""
  TERMII_SENDER_ID: "VoteWise"
  SENTRY_DSN: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
